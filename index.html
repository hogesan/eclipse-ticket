<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse - 特別記念チケット</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #06040a;
            background-image: radial-gradient(circle at center, #150f24 0%, #06040a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Georgia', serif;
            position: relative;
        }
        /* 封筒全体のコンテナ */
        .envelope-wrapper {
            position: relative;
            width: 360px;
            height: 250px;
            cursor: pointer;
            perspective: 1200px;
            transition: transform 0.3s ease;
            margin-top: 180px; 
            z-index: 10;
        }
        .envelope-wrapper:hover {
            transform: translateY(-8px);
        }
        /* 封筒の本体 */
        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #140e21;
            border: 2px solid #bfa15f; 
            border-radius: 4px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            z-index: 2;
            overflow: hidden;
        }
        .envelope::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, transparent 40%, rgba(191, 161, 95, 0.05) 70%);
            border: 1px dashed rgba(191, 161, 95, 0.1);
            animation: rotateMagic 20s linear infinite;
        }
        @keyframes rotateMagic {
            100% { transform: rotate(360deg); }
        }
        /* 封筒のフタ（あけ口） */
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-top: 130px solid #1c142e;
            transform-origin: top;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5));
        }
        .flap::after {
            content: '';
            position: absolute;
            top: -130px;
            left: -180px;
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-top: 126px solid #140e21;
        }
        /* 前面ポケット */
        .pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-bottom: 140px solid #181129;
            z-index: 4;
            filter: drop-shadow(0 -2px 5px rgba(0,0,0,0.3));
        }
        /* シーリングスタンプ */
        .stamp {
            position: absolute;
            top: 110px;
            left: 155px;
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #a62424 0%, #731313 100%);
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
            transition: opacity 0.3s ease, transform 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .stamp::after {
            content: '☀️';
            font-size: 20px;
            filter: grayscale(1) brightness(0.5);
            opacity: 0.6;
        }
        /* チケット画像の位置 */
        .ticket {
            position: absolute;
            top: 25px; 
            left: 50%;
            transform: translateX(-50%) translateY(0) scale(0.65); 
            width: 320px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }
        /* 【開いた状態】 */
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .envelope-wrapper.open .stamp {
            transform: translateY(-60px) rotate(20deg);
            opacity: 0;
        }
        .envelope-wrapper.open .ticket {
            transform: translateX(-50%) translateY(-390px) scale(1.35);
            z-index: 15;
        }
        /* 下部の案内テキスト */
        .hint {
            position: absolute;
            bottom: -60px;
            width: 100%;
            text-align: center;
            color: #bfa15f;
            font-size: 13px;
            letter-spacing: 0.15em;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        /* キラキラ（星）のスタイル */
        .sparkle {
            position: absolute;
            background: radial-gradient(circle, #fff 0%, rgba(255,220,120,0.8) 40%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99;
            animation: fly linear forwards;
        }
        @keyframes fly {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }
            10% {
                transform: translate(var(--mx), var(--my)) scale(1);
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- 幻想的な魔法のフリー音源を自動ロード -->
    <audio id="openSound" src="https://mixkit.co" preload="auto"></audio>

    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="flap"></div>
        <div class="stamp"></div>
        <div class="envelope"></div>
        <div class="pocket"></div>
        
        <img src="ticket.jpg" alt="Eclipse 特別記念チケット" class="ticket">
        
        <div class="hint" id="hintText">封筒の刻印をタップしてチケットを授かる</div>
    </div>

    <script>
        const wrapper = document.getElementById('envelopeWrapper');
        const hint = document.getElementById('hintText');
        const sound = document.getElementById('openSound');

        wrapper.addEventListener('click', (e) => {
            wrapper.classList.toggle('open');
            
            if(wrapper.classList.contains('open')) {
                hint.textContent = "旅人よ、世界の再生を見届けてくれてありがとう";
                hint.style.animation = "none";
                hint.style.color = "#fff";
                
                // 音声を再生（タップ操作と連動しているのでスマホでも鳴ります）
                sound.currentTime = 0;
                sound.volume = 0.5;
                sound.play().catch(err => console.log("Audio play blocked"));

                // 星空キラキラエフェクトを大量生成
                createSparkles(50);
            } else {
                hint.textContent = "封筒の刻印をタップしてチケットを授かる";
                hint.style.animation = "pulse 2s infinite";
                hint.style.color = "#bfa15f";
            }
        });

        // キラキラ粒子をランダムに飛び散らせる関数
        function createSparkles(num) {
            for (let i = 0; i < num; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                // 画面中央（封筒の位置）をスタート地点にする
                const startX = window.innerWidth / 2;
                const startY = window.innerHeight / 2 + 50;
                
                sparkle.style.left = startX + 'px';
                sparkle.style.top = startY + 'px';
                
                // 大きさをランダムに設定
                const size = Math.random() * 8 + 4;
                sparkle.style.width = size + 'px';
                sparkle.style.height = size + 'px';
                
                // 飛び散る軌道をランダムに計算（星空のように四方八方へ）
                const angle = Math.random() * Math.PI * 2;
                const distance1 = Math.random() * 100 + 50;
                const distance2 = Math.random() * 300 + 150;
                
                const mx = Math.cos(angle) * distance1;
                const my = Math.sin(angle) * distance1;
                const tx = Math.cos(angle) * distance2;
                const ty = Math.sin(angle) * distance2 - 100; // やや上に向かって流れるように
                
                sparkle.style.setProperty('--mx', `${mx}px`);
                sparkle.style.setProperty('--my', `${my}px`);
                sparkle.style.setProperty('--tx', `${tx}px`);
                sparkle.style.setProperty('--ty', `${ty}px`);
                
                // アニメーション時間をランダムにして星の瞬きを表現
                sparkle.style.animationDuration = (Math.random() * 1.5 + 1.0) + 's';
                
                document.body.appendChild(sparkle);
                
                // アニメーションが終わったら消去
                setTimeout(() => {
                    sparkle.remove();
                }, 2500);
            }
        }
    </script>
</body>
</html>
