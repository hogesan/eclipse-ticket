
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080510">
<title>Eclipse - 特別記念チケット</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background:
        radial-gradient(ellipse at center, #1b1230 0%, #0c0815 55%, #06040a 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Georgia, serif;
    color: white;
}

/* 背景の光 */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 45%,
        rgba(130, 91, 180, 0.08),
        transparent 45%);
    pointer-events: none;
}

/* メイン */
.scene {
    position: relative;
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 封筒 */
.envelope-wrapper {
    position: relative;
    width: min(360px, 86vw);
    height: 380px;
    cursor: pointer;
    perspective: 1200px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    transform: translateY(20px);
}

/* 封筒本体 */
.envelope {
    position: absolute;
    inset: 0;
    background: #140e21;
    border: 2px solid #bfa15f;
    border-radius: 5px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.8),
        0 0 30px rgba(191,161,95,0.08);
    z-index: 2;
    overflow: hidden;
}

.envelope::before {
    content: "";
    position: absolute;
    inset: -50%;
    background:
        radial-gradient(circle, transparent 40%,
        rgba(191,161,95,0.07) 75%);
    animation: rotateMagic 30s linear infinite;
}

@keyframes rotateMagic {
    to { transform: rotate(360deg); }
}

/* 封筒のフタ */
.flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 180px solid transparent;
    border-right: 180px solid transparent;
    border-top: 180px solid #1c142e;
    transform-origin: top center;
    transition:
        transform 0.85s cubic-bezier(.2,.7,.2,1),
        z-index 0s 0.4s;
    z-index: 5;
    filter: drop-shadow(0 5px 8px rgba(0,0,0,0.5));
}

.flap::after {
    content: "";
    position: absolute;
    top: -180px;
    left: -180px;
    width: 0;
    height: 0;
    border-left: 180px solid transparent;
    border-right: 180px solid transparent;
    border-top: 176px solid #140e21;
}

/* 前面のポケット */
.pocket {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 180px solid transparent;
    border-right: 180px solid transparent;
    border-bottom: 220px solid #181129;
    z-index: 4;
    filter: drop-shadow(0 -3px 8px rgba(0,0,0,0.4));
}

/* 赤い封印 */
.stamp {
    position: absolute;
    top: 155px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: radial-gradient(circle, #b72c2c, #731313);
    box-shadow:
        0 4px 15px rgba(0,0,0,0.7),
        inset 0 2px 5px rgba(255,255,255,0.25),
        0 0 15px rgba(180,30,30,0.2);
    z-index: 6;
    display: flex;
    justify-content: center;
    align-items: center;
    transition:
        opacity .5s ease,
        transform .7s ease;
}

.stamp::after {
    content: "✦";
    color: #7d3333;
    font-size: 23px;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
}

/* チケット */
.ticket-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 370px;
    overflow: hidden;
    z-index: 1;
    transition: overflow 0s .1s;
}

.ticket {
    position: absolute;
    top: 15px;
    left: 50%;
    width: 320px;
    max-width: 90%;
    height: auto;
    border-radius: 8px;
    transform: translateX(-50%) translateY(0) scale(.85);
    opacity: 1;
    box-shadow: 0 15px 45px rgba(0,0,0,.8);
    transition:
        transform 1.1s cubic-bezier(.15,.8,.25,1),
        opacity .6s ease;
    z-index: 1;
}

/* 開封後 */
.envelope-wrapper.open .ticket-container {
    overflow: visible;
    z-index: 7;
}

.envelope-wrapper.open .flap {
    transform: rotateX(180deg);
    z-index: 1;
}

.envelope-wrapper.open .stamp {
    transform: translateX(-50%) translateY(-70px) scale(.5) rotate(25deg);
    opacity: 0;
    pointer-events: none;
}

.envelope-wrapper.open .ticket {
    transform: translateX(-50%) translateY(-280px) scale(1.08);
    z-index: 8;
}

/* 封筒の浮遊 */
.envelope-wrapper:hover {
    transform: translateY(12px);
}

/* 案内文 */
.hint {
    position: absolute;
    top: calc(100% + 65px);
    left: 50%;
    transform: translateX(-50%);
    width: 95vw;
    text-align: center;
    color: #bfa15f;
    font-size: 13px;
    letter-spacing: .13em;
    line-height: 1.8;
    animation: pulse 2s infinite;
    transition: color .5s;
}

@keyframes pulse {
    0%,100% { opacity: .4; }
    50% { opacity: 1; }
}

/* キラキラ粒子 */
.sparkle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 100;
    background: radial-gradient(
        circle,
        #ffffff 0%,
        #fff3c4 25%,
        #e9bc66 55%,
        transparent 100%
    );
    box-shadow: 0 0 12px rgba(255,220,140,.8);
    animation: sparkleFly linear forwards;
}

@keyframes sparkleFly {
    0% {
        transform: translate(0,0) scale(0);
        opacity: 0;
    }
    15% {
        transform: translate(var(--mx),var(--my)) scale(1.2);
        opacity: 1;
    }
    100% {
        transform: translate(var(--tx),var(--ty)) scale(0);
        opacity: 0;
    }
}

/* 大きな光 */
.flash {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    background: radial-gradient(
        circle at center,
        rgba(255,220,150,.35),
        transparent 65%
    );
    animation: flashEffect 1.2s ease-out forwards;
}

@keyframes flashEffect {
    0% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 0; }
}

/* メッセージ */
.message {
    position: fixed;
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%) translateY(15px);
    width: 90%;
    text-align: center;
    font-size: 13px;
    letter-spacing: .16em;
    line-height: 2;
    color: #e8d7aa;
    opacity: 0;
    transition: all 1.2s ease;
    pointer-events: none;
    text-shadow: 0 0 15px rgba(255,220,150,.5);
}

.message.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* スマホ */
@media (max-width: 480px) {
    .envelope-wrapper {
        transform: translateY(-5px) scale(.88);
    }

    .envelope-wrapper:hover {
        transform: translateY(-5px) scale(.88);
    }

    .envelope-wrapper.open .ticket {
        transform: translateX(-50%) translateY(-270px) scale(.98);
    }

    .hint {
        font-size: 12px;
        top: calc(100% + 55px);
    }

    .message {
        bottom: 4%;
        font-size: 11px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .envelope::before {
        animation: none;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="envelope-wrapper" id="envelopeWrapper"
         role="button" tabindex="0"
         aria-label="封筒を開く">

        <div class="ticket-container">
            <img
                src="ticket.jpg"
                alt="Eclipse 特別記念チケット"
                class="ticket"
            >
        </div>

        <div class="envelope"></div>
        <div class="flap"></div>
        <div class="pocket"></div>
        <div class="stamp"></div>

        <div class="hint" id="hintText">
            封筒の刻印をタップしてチケットを授かる
        </div>

    </div>

</div>

<div class="message" id="message">
    旅人よ、世界の再生を見届けてくれてありがとう。
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const wrapper = document.getElementById("envelopeWrapper");
    const hint = document.getElementById("hintText");
    const message = document.getElementById("message");

    let opened = false;
    let audioContext = null;

    console.log("ECLIPSE SYSTEM READY");

    // 音を鳴らす
    function playSparkleSound() {

        try {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) return;

            if (!audioContext) {
                audioContext = new AudioContext();
            }

            audioContext.resume().then(() => {

                const notes = [
                    {freq: 783.99, time: 0, volume: .10},
                    {freq: 987.77, time: .12, volume: .12},
                    {freq: 1174.66, time: .24, volume: .13},
                    {freq: 1567.98, time: .38, volume: .12},
                    {freq: 1975.53, time: .52, volume: .10},
                    {freq: 1567.98, time: .75, volume: .07},
                    {freq: 2093.00, time: .95, volume: .08}
                ];

                const now = audioContext.currentTime;

                notes.forEach(note => {

                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();

                    osc.type = "sine";
                    osc.frequency.setValueAtTime(
                        note.freq,
                        now + note.time
                    );

                    gain.gain.setValueAtTime(
                        0,
                        now + note.time
                    );

                    gain.gain.linearRampToValueAtTime(
                        note.volume,
                        now + note.time + .025
                    );

                    gain.gain.exponentialRampToValueAtTime(
                        .0001,
                        now + note.time + 1.1
                    );

                    osc.connect(gain);
                    gain.connect(audioContext.destination);

                    osc.start(now + note.time);
                    osc.stop(now + note.time + 1.15);

                });

            });

        } catch(error) {
            console.error("Sound Error:", error);
        }
    }

    // キラキラの光を生成
    function createSparkles(amount) {

        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        for (let i = 0; i < amount; i++) {

            const sparkle = document.createElement("div");
            sparkle.className = "sparkle";

            const size = Math.random() * 9 + 3;

            sparkle.style.width = size + "px";
            sparkle.style.height = size + "px";

            sparkle.style.left = centerX + "px";
            sparkle.style.top = centerY + "px";

            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 400 + 100;

            const mx = Math.cos(angle) * 50;
            const my = Math.sin(angle) * 50;

            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;

            sparkle.style.setProperty("--mx", mx + "px");
            sparkle.style.setProperty("--my", my + "px");
            sparkle.style.setProperty("--tx", tx + "px");
            sparkle.style.setProperty("--ty", ty + "px");

            sparkle.style.animationDuration =
                (Math.random() * 1.5 + 1) + "s";

            document.body.appendChild(sparkle);

            sparkle.addEventListener("animationend", () => {
                sparkle.remove();
            });

        }
    }

    // 画面全体の光
    function createFlash() {

        const flash = document.createElement("div");
        flash.className = "flash";

        document.body.appendChild(flash);

        flash.addEventListener("animationend", () => {
            flash.remove();
        });
    }

    // 開封処理
    function openEnvelope() {

        if (opened) return;

        opened = true;

        console.log("ECLIPSE ENVELOPE OPENED");

        // 封筒を開く
        wrapper.classList.add("open");

        // 案内文
        hint.textContent = "THE SEAL HAS BEEN BROKEN";
        hint.style.animation = "none";
        hint.style.color = "#e8d7aa";

        // 音と光
        playSparkleSound();
        createSparkles(85);
        createFlash();

        // 少し遅れて追加の光
        setTimeout(() => {
            createSparkles(35);
        }, 450);

        // メッセージ表示
        setTimeout(() => {
            message.classList.add("show");
        }, 1300);

    }

    // PC・スマホ共通クリック
    wrapper.addEventListener("click", openEnvelope);

    // キーボード操作にも対応
    wrapper.addEventListener("keydown", (event) => {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {
            event.preventDefault();
            openEnvelope();
        }

    });

});
</script>

</body>
</html>
